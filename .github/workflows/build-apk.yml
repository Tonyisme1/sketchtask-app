name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Assets (Vite)
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          cd client/android
          chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output/SketchTask.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SketchTask-Android-APK
          path: output/SketchTask.apk
          retention-days: 30
