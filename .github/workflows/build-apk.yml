name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Assets & Sync Capacitor
        run: |
          cd client
          npm install
          npm run build
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SketchTask-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: SketchTask Android App v1.0.0
          body: "Tải file cài đặt SketchTask.apk trực tiếp cho điện thoại Android."
          draft: false
          prerelease: false
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
