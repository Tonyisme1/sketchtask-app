name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          cd client
          npm install
          npm run build

      - name: Sync Web Assets into Android
        run: |
          cd client
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          node ./node_modules/@capacitor/cli/bin/capacitor sync android || true

      - name: Build APK with Gradle
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output/SketchTask.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SketchTask-Android-APK
          path: output/SketchTask.apk
          retention-days: 30
