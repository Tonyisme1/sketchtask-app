<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="#FBF9F4" />
  
  <!-- Hard Offset Shadow -->
  <rect x="100" y="100" width="320" height="320" rx="36" fill="#262626" />
  
  <!-- Yellow Emblem Tile with Hand-Drawn Ink Border -->
  <rect x="90" y="90" width="320" height="320" rx="36" fill="#FEF08A" stroke="#262626" stroke-width="16" />
  
  <!-- Notebook Sketch Spine -->
  <path d="M160 160 L160 352" stroke="#262626" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 18" />
  
  <!-- Stylized Fountain Pen / Checkmark Stroke -->
  <path d="M210 260 L260 310 L350 190" stroke="#262626" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Notebook Paper Horizon Line -->
  <path d="M210 350 L340 350" stroke="#262626" stroke-width="14" stroke-linecap="round" />
</svg>

