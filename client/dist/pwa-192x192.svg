<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Nền Canvas Giấy Trắng Ngà -->
  <rect width="192" height="192" rx="42" fill="#FBF9F4" />
  
  <!-- Bóng Đổ Sổ Tay -->
  <rect x="36" y="36" width="128" height="128" rx="12" fill="#262626" />
  
  <!-- Bìa Sổ Tay Vàng Nghệ -->
  <rect x="30" y="30" width="128" height="128" rx="12" fill="#FEF08A" stroke="#262626" stroke-width="6" />
  
  <!-- Dải Gáy Sổ (Notebook Spine) -->
  <rect x="30" y="30" width="26" height="128" rx="6" fill="#FDE047" stroke="#262626" stroke-width="6" />
  <line x1="56" y1="30" x2="56" y2="158" stroke="#262626" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Các khoen gáy sổ -->
  <circle cx="43" cy="52" r="3.5" fill="#262626" />
  <circle cx="43" cy="74" r="3.5" fill="#262626" />
  <circle cx="43" cy="96" r="3.5" fill="#262626" />
  <circle cx="43" cy="118" r="3.5" fill="#262626" />
  <circle cx="43" cy="140" r="3.5" fill="#262626" />

  <!-- Dấu Tick Hoàn Thành Vẽ Tay Sắc Nét -->
  <path d="M75 94 L97 116 L138 64" fill="none" stroke="#1C1917" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dòng Kẻ Phác Thảo Ngang -->
  <line x1="75" y1="137" x2="132" y2="137" stroke="#78716C" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 6" />
</svg>
