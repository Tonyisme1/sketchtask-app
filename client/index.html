<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FBF9F4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SketchTask" />
    <meta
      name="description"
      content="SketchTask - Sổ tay công việc cá nhân số theo phong cách phác thảo ấm áp"
    />
    <title>SketchTask - Sổ Tay Công Việc Cá Nhân</title>
    <!-- Google Fonts: Inter, Plus Jakarta Sans, Caveat, Patrick Hand, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#FBF9F4] text-[#1C1917] antialiased overscroll-none select-none"
  >
    <div id="root">
      <div
        style="
          min-height: 100vh;
          background-color: #fbf9f4;
          display: flex;
          flex-direction: column;
        "
      >
        <!-- Topbar Placeholder Skeleton -->
        <header
          style="
            height: 52px;
            background-color: #fbf9f4;
            border-bottom: 1.5px solid #262626;
            box-shadow: 0px 2px 0px #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
          "
        >
          <div style="display: flex; align-items: center; gap: 8px">
            <div
              style="
                width: 28px;
                height: 28px;
                background-color: #fef08a;
                border: 1.5px solid #262626;
                border-radius: 4px;
                box-shadow: 1.5px 1.5px 0px #262626;
                transform: rotate(-1.5deg);
              "
            ></div>
            <span
              style="
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-weight: 700;
                font-size: 14px;
                color: #1c1917;
              "
              >SketchTask</span
            >
          </div>
          <div
            style="
              width: 32px;
              height: 32px;
              background-color: #ffffff;
              border: 1.5px solid #262626;
              border-radius: 4px;
            "
          ></div>
        </header>

        <!-- Main Content Skeleton -->
        <main
          style="
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
          "
        >
          <div
            style="
              height: 38px;
              background-color: #ffffff;
              border: 1.5px solid #262626;
              border-radius: 6px;
              box-shadow: 2px 2px 0px #262626;
              margin-bottom: 16px;
            "
          ></div>
          <div
            style="
              height: 54px;
              background-color: #ffffff;
              border: 1.5px solid #262626;
              border-radius: 6px;
              box-shadow: 2px 2px 0px #262626;
            "
          ></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
